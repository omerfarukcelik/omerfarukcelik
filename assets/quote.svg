<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="300" rx="18" fill="#1a1b27"/>
  <text x="55" y="82" fill="#bf91f3" font-size="40" font-family="Arial, Luminari" font-style="italic" font-weight="700">"</text>

  <text fill="#38bdae" font-size="34" font-family="JetBrains Mono, Luminari" font-style="italic" font-weight="600">
    <tspan x="70" y="85">The computing scientist’s main challenge is not</tspan><tspan x="70" y="130">to get confused by the complexities of his own</tspan><tspan x="70" y="175">making.</tspan>
  </text>

  <text x="800" y="275" text-anchor="end" fill="#70a5fd" font-size="28" font-family="Space Grotesk, Luminari" font-weight="600">
    — Edsger W. Dijkstra
  </text>
</svg>
